name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_PATH != '' }}
        run: |
          gradle assembleRelease \
            -PSAI_RELEASE_STORE_FILE="$KEYSTORE_PATH" \
            -PSAI_RELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PSAI_RELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PSAI_RELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Build debug-signed fallback APK
        if: ${{ env.KEYSTORE_PATH == '' }}
        run: |
          echo "::warning::No signing secrets configured (see docs/RELEASING.md). Falling back to a debug-signed APK."
          gradle assembleDebug

      - name: Locate and rename APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          DEST="S.Ai-v${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "S.Ai ${{ github.ref_name }}"
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
